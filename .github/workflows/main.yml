
name: Build Backrooms Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build V6.0 3D Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V6.0 project
        run: |
          unzip -o Backrooms_The_Descent_3D_v6.zip -d extracted

      - name: Locate Android project
        run: |
          BUILD_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $BUILD_DIR"

      - name: Fix pickup model scaling
        run: |
          sed -i 's/\.scale(\.55f)/.scale(.55f, .55f, .55f)/' "$BUILD_DIR/app/src/main/java/com/carter/backrooms/DescentGame.java"
          grep -n 'scale(.55f' "$BUILD_DIR/app/src/main/java/com/carter/backrooms/DescentGame.java"

      - name: Build debug APK
        run: gradle -p "$BUILD_DIR" --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-The-Descent-V6-3D
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
