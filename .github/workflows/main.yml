
name: Build Backrooms Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Backrooms V1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract V1.0 project
        run: |
          unzip -o Backrooms_The_Descent_Android_V1.0.zip -d extracted

      - name: Locate Android project
        run: |
          BUILD_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$BUILD_DIR" --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="$BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-The-Descent-V1.0.0
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
