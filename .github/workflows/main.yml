
name: Build Backrooms Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract game project
        run: |
          unzip -o Backrooms_The_Descent_GitHub_Project.zip -d extracted

      - name: Build APK
        run: |
          BUILD_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"

          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: Could not find settings.gradle!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Found Gradle project at: $BUILD_DIR"
          gradle -p "$BUILD_DIR" --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Backrooms-The-Descent-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 14
          
